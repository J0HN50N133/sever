[package]
name = "minchash"
description = "Multiset Incremental Hash Lib in Rust"
version = "0.3.1"
authors = ["Mika Sanchez <keyneom122@hotmail.com>"]
edition = "2021"
license = "MIT"

[dependencies]
k256 = "0.11"
blake3 = "1.5"
hex = "0.4"
rayon = "1.10"
rand = "0.9"

[dev-dependencies]
logforth = { version = "0.29", features = ["starter-log"] }
log = "0.4"
itertools = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[[bench]]
name = "issuer_benchmark"
harness = false

[[bench]]
name = "client_benchmark"
harness = false

[[bench]]
name = "batch_benchmark"
harness = false

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "lazy_client_benchmark"
harness = false
